name: Python Security Toolkit CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security:
    name: Quality & security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install project and tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Bandit SAST
        run: bandit -q -r src

      - name: Build package
        run: python -m build

      - name: CLI smoke test
        run: sec-toolkit --help
