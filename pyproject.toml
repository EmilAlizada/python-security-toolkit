[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emil-security-toolkit"
version = "0.1.0"
description = "Defensive Python security utilities for integrity, headers, IOC extraction, and log analysis"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
  {name = "Emil Alizada"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.scripts]
sec-toolkit = "security_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/security_toolkit/headers.py" = ["S310"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["security_toolkit"]
mypy_path = "src"
